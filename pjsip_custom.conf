; SIP24.CC Premium Trunk Configuration
; Optimized for SRTP and Identity Transmission

[sip24-trunk]
type=registration
outbound_auth=sip24-auth
server_uri=sip:srv2.sip24.cc
client_uri=sip:YOUR_SIP_USER@gw.sip24.cc

[sip24-auth]
type=auth
auth_type=password
password=YOUR_PASSWORD
username=YOUR_USERNAME

[sip24-endpoint]
type=endpoint
context=from-external
disallow=all
allow=ulaw,alaw,g729
media_encryption=srtp
use_avpf=yes
rtp_symmetric=yes
rewrite_contact=yes
force_rport=yes
; Support for CallerID Identity Control
send_pai=yes
trust_id_inbound=yes
